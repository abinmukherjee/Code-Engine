server:
  port: 8080

spring:
  application:
    name: distributed-code-judge
  datasource:
    url: jdbc:h2:mem:judge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

judge:
  max-code-length: 8000
  memory-limit-mb: 256
  timeout-ms: 5000
  session-ttl-hours: 24
  rate-limit:
    capacity: 8
    refill-per-minute: 12
    sliding-window-limit: 20
    sliding-window-seconds: 60

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/judge}
    username: ${JDBC_USER:judge}
    password: ${JDBC_PASSWORD:judge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
